# Configuración mínima de las pruebas de elastiflix-ingest.
# Failsafe y spring-boot:run trabajan desde la carpeta del módulo, así que ../.env es la raíz del repo.
spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  elasticsearch:
    uris: ${elastiflix.elasticsearch.url}
    api-key: ${elastiflix.elasticsearch.api-key}

elastiflix:
  elasticsearch:
    url: ${ELASTICSEARCH_URL:}
    api-key: ${ELASTICSEARCH_API_KEY:}
  index:
    alias: ${ELASTIFLIX_INDEX_ALIAS:elastiflix-reloaded}
  inference:
    id: ${ELASTIFLIX_INFERENCE_ID:.jina-embeddings-v5-omni-small}
