<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="stripe" class="stripe" aria-hidden="true"></div>

<header th:fragment="header" class="site-header">
  <div class="brand-row">
    <div class="logo" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#2E2A3B"><path d="M8 5.5v13l10.5-6.5z"></path></svg>
    </div>
    <nav class="site-nav" aria-label="Principal">
      <a th:href="@{/}" th:classappend="${nav == 'buscar'} ? 'is-current' : ''" th:attr="aria-current=${nav == 'buscar'} ? 'page' : null">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        Buscar
      </a>
      <a th:href="@{/cargar}" th:classappend="${nav == 'cargar'} ? 'is-current' : ''" th:attr="aria-current=${nav == 'cargar'} ? 'page' : null">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4 M7 9l5-5l5 5 M4 20h16"></path></svg>
        Cargar datos
      </a>
      <a th:href="@{/acerca}" th:classappend="${nav == 'acerca'} ? 'is-current' : ''" th:attr="aria-current=${nav == 'acerca'} ? 'page' : null">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5 M12 8h.01"></path></svg>
        Acerca de la demo
      </a>
    </nav>
  </div>
  <div class="header-right">
    <nav class="lang-switch" th:attr="aria-label=${shell.lang == 'en' ? 'Language' : 'Idioma'}">
      <a th:href="${shell.esHref}" lang="es" hreflang="es" title="Español"
         th:classappend="${shell.lang == 'es'} ? 'is-current' : ''"
         th:attr="aria-current=${shell.lang == 'es'} ? 'true' : null">
        <span aria-hidden="true">ES</span>
        <span class="visually-hidden">Español</span>
      </a>
      <a th:href="${shell.enHref}" lang="en" hreflang="en" title="English"
         th:classappend="${shell.lang == 'en'} ? 'is-current' : ''"
         th:attr="aria-current=${shell.lang == 'en'} ? 'true' : null">
        <span aria-hidden="true">EN</span>
        <span class="visually-hidden">English</span>
      </a>
    </nav>
    <div class="connection" th:attr="data-connected=${shell.connected}">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8C8597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"></ellipse><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6 M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"></path></svg>
      <span class="dot" th:classappend="${shell.connected} ? '' : 'is-down'" aria-hidden="true"></span>
      <span th:text="${shell.connectionLabel}">Conectado · Elasticsearch Serverless</span>
    </div>
  </div>
</header>

<footer th:fragment="footer" class="site-footer">
  <span>Elastiflix-Movies Java · demo de búsqueda</span>
  <span th:text="${shell.indexLabel}">Índice: elastiflix-reloaded</span>
  <span class="tmdb" th:text="${shell.tmdbNotice}">This product uses the TMDB API but is not endorsed or certified by TMDB.</span>
</footer>

</body>
</html>
