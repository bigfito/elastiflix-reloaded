home.lexical.multiHelp=multi-match busca en los dos campos, <code>title</code> y <code>original_title</code>, con el tipo <code>best_fields</code>: cada campo se evalúa por separado y cuenta el que mejor coincide. Con AND, todas las palabras deben aparecer en un mismo campo.
home.lexical.bm25Help=<strong>Retrieval con BM25:</strong> la relevancia de cada película se calcula con BM25, el algoritmo de puntuación por defecto de Elasticsearch para campos <code>text</code>. Favorece los términos de la consulta que aparecen en el campo y que son poco comunes en el catálogo, y ajusta la puntuación según la longitud del campo.
home.vector.hybridTitle=Componente vectorial · k-NN
home.vector.field.aria=Campo vectorial
home.vector.field.label=Vector k-NN
home.vector.dims.initial=256 dimensiones.
home.vector.dims.suffix=dimensiones.
home.vector.dims.help=Es una de las tres representaciones vectoriales de la sinopsis (<code>plot</code>). Más dimensiones suelen capturar más matices del significado, a cambio de más memoria y de comparaciones más costosas.
home.vector.k.help=Número máximo de resultados que devuelve la búsqueda vectorial, después de combinar los candidatos de todos los shards; se reparten en páginas de 25, 50 o 100. Debe ser menor o igual que <code>num_candidates</code>.
home.vector.k.hybridHelp=En modo híbrido también fija cuántos resultados de cada lista entran a la fusión y cuántos resultados combinados se pueden recorrer.
home.vector.cand.help=Candidatos que se evalúan en cada shard antes de quedarse con los <code>k</code> mejores. Subirlo tiende a mejorar la precisión, a cambio de más tiempo de respuesta. Máximo 10 000.
home.vector.knnHelp=<strong>k-NN (k vecinos más cercanos):</strong> tu consulta se convierte en un vector y se buscan las películas cuya sinopsis tiene el vector más cercano. Elasticsearch lo hace de forma aproximada sobre un grafo HNSW, sin comparar contra todo el catálogo, lo que la hace rápida aunque no siempre exacta.
home.knn.error.k=k debe ser un entero mayor o igual que 1.
home.knn.error.candMax=num_candidates debe ser un entero de máximo 10 000.
home.knn.error.candMin=num_candidates debe ser mayor o igual que k.
home.hybrid.title=Fusión · RRF
home.hybrid.rrfHelp=<strong>Reciprocal Rank Fusion:</strong> Elasticsearch ejecuta por separado la búsqueda BM25 y la búsqueda k-NN, y combina las dos listas según la posición de cada película en ellas, no según su puntuación, porque las escalas de BM25 y de la similitud vectorial no son comparables. Una película que aparece arriba en ambas listas sube en el resultado final.
