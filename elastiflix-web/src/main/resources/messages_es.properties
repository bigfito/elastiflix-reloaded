# Página Acerca de la demo (/acerca)
about.page.title=Acerca de la demo
about.intro.eyebrow=Acerca de la demo
about.intro.heading=Tres formas de buscar una película
about.intro.lead=Elastiflix-Movies Java busca en un catálogo de películas guardado en un índice de Elasticsearch Serverless. Con la misma consulta puedes probar tres modos de búsqueda y ver cómo cambia lo que encuentra cada uno: por palabras, por significado o combinando ambos. Además puedes acotar los resultados con filtros y cargar nuevas películas al catálogo.

about.modes.aria=Resumen de los modos
about.modes.fulltext.title=Full-text (léxica)
about.modes.fulltext.desc=Encuentra películas cuyo título contiene las palabras de tu consulta.
about.modes.fulltext.meta=BM25 · title, original_title
about.modes.vector.title=Vectorial
about.modes.vector.desc=Encuentra películas cuya sinopsis se parece en significado a lo que describes.
about.modes.vector.meta=k-NN · plot_256, plot_512, plot_1024
about.modes.hybrid.title=Híbrida
about.modes.hybrid.desc=Ejecuta las dos búsquedas anteriores y combina sus resultados en una sola lista.
about.modes.hybrid.meta=BM25 + k-NN · fusión RRF

about.common.settings=Ajustes disponibles
about.common.docs=Documentación
about.common.field=Campo
about.common.type=Tipo

about.fulltext.heading=Full-text (léxica)
about.fulltext.lead=Busca coincidencias de términos en los campos <code>title</code> y <code>original_title</code>, ambos de tipo <code>text</code>. Elasticsearch analiza el texto de la consulta en tokens y los compara con los tokens indexados de cada título.
about.fulltext.bm25.title=Cómo se calcula la relevancia: BM25
about.fulltext.bm25.body=BM25 es el algoritmo de puntuación por defecto de Elasticsearch para campos <code>text</code>. Favorece los términos de la consulta que aparecen en el campo y que son poco comunes en el catálogo. Dos parámetros controlan su comportamiento: <code>k1</code> (por defecto 1.2) limita cuánto suma que un término se repita, y <code>b</code> (por defecto 0.75) ajusta la puntuación según la longitud del campo.
about.fulltext.match.dt=Tipo de consulta: match
about.fulltext.match.dd=Busca en un solo campo, que eliges entre <code>title</code> y <code>original_title</code>.
about.fulltext.multimatch.dt=Tipo de consulta: multi-match
about.fulltext.multimatch.dd=Busca en los dos campos a la vez con el tipo <code>best_fields</code>: cada campo se evalúa por separado y la película recibe la puntuación del campo que mejor coincide.
about.fulltext.or.dt=Operador: OR
about.fulltext.or.dd=Basta con que aparezca una de las palabras de la consulta. Es el comportamiento por defecto de Elasticsearch.
about.fulltext.and.dt=Operador: AND
about.fulltext.and.dd=Deben aparecer todas las palabras. Con multi-match y <code>best_fields</code>, todas deben estar en un mismo campo: no se pueden repartir entre <code>title</code> y <code>original_title</code>.

about.vector.heading=Vectorial
about.vector.lead=Busca por significado en la sinopsis de cada película (campo <code>plot</code>). El texto de tu consulta se convierte en un vector con el modelo <strong>jina-embeddings-v5-omni-small</strong> y Elasticsearch devuelve las películas cuyos vectores de sinopsis están más cerca, usando el retriever <code>knn</code>.
about.vector.knn.title=Cómo funciona k-NN
about.vector.knn.body=k-NN (k vecinos más cercanos) busca los vectores más próximos al vector de la consulta. Elasticsearch lo hace de forma aproximada sobre un grafo HNSW: recorre el grafo en lugar de comparar contra todo el catálogo, lo que la hace rápida aunque no siempre exacta.
about.vector.reps.title=Las tres representaciones de la sinopsis
about.vector.reps.body=El objetivo de este modo es comprobar cómo el número de dimensiones del vector influye en la precisión de los resultados. Los tres campos vienen del mismo modelo: su dimensión nativa es 1024 y admite recorte Matryoshka a 256 y 512.
about.vector.table.dimensions=Dimensiones
about.vector.table.source=Origen
about.vector.table.matryoshka=Primeros valores del vector de 1024, renormalizados (Matryoshka)
about.vector.table.full=Vector completo del modelo
about.vector.fair=<strong>Una comparación justa.</strong> Los tres campos usan la misma configuración de índice: <code>index_options</code> de tipo <code>hnsw</code> con vectores float sin cuantización, los mismos <code>m</code> (16) y <code>ef_construction</code> (100), los valores por defecto de Elasticsearch, y similitud <code>cosine</code>. Así, la única diferencia entre ellos es el número de dimensiones.
about.vector.precision.title=Precisión medida por dimensión
about.vector.precision.lead=Medido en el catálogo original de 4 322 películas. Se midió con 32 descripciones de trama (26 en español y 6 en inglés), cada una con una sola película correcta del catálogo y sin palabras de su título. Las posiciones se obtuvieron en Elasticsearch y se confirmaron con una búsqueda exacta por fuerza bruta: coinciden en todos los casos.
about.vector.precision.th.rank1=Correcta en 1.er lugar
about.vector.precision.th.top5=Entre las 5 primeras
about.vector.precision.th.top10=Entre las 10 primeras
about.vector.precision.r256=22 de 32 (69 %)
about.vector.precision.r512=25 de 32 (78 %)
about.vector.precision.r1024=26 de 32 (81 %)
about.vector.precision.mrr=El MRR premia que la película correcta quede arriba: vale 1 si siempre sale 1.ª y 0.5 si siempre sale 2.ª. En 24 de las 32 consultas la posición es la misma en los tres campos; las diferencias se concentran en las descripciones más difíciles:
about.vector.precision.movie=Película
about.vector.rank.1=1.º
about.vector.rank.2=2.º
about.vector.rank.3=3.º
about.vector.rank.4=4.º
about.vector.rank.10=10.º
about.vector.rank.21=21.º
about.vector.precision.b1=256 dimensiones pierde precisión de forma clara; 512 queda muy cerca de 1024 con la mitad del tamaño.
about.vector.precision.b2=Más dimensiones no siempre es mejor en cada caso: Forrest Gump queda 21.º, 8.º y 18.º.
about.vector.precision.b3=Con 32 consultas es una tendencia clara, no una conclusión estadística firme.
about.vector.setting.field.dt=Vector k-NN
about.vector.setting.field.dd=El campo sobre el que se busca: <code>plot_256</code>, <code>plot_512</code> o <code>plot_1024</code>. Más dimensiones suelen capturar más matices del significado, a cambio de más memoria y de comparaciones más costosas.
about.vector.setting.k.dd=Número máximo de resultados que devuelve la búsqueda vectorial, después de combinar los candidatos de todos los shards; se reparten en páginas de 25, 50 o 100. Debe ser menor o igual que <code>num_candidates</code>. Valor inicial: 100.
about.vector.setting.cand.dd=Candidatos que se evalúan en cada shard antes de quedarse con los <code>k</code> mejores. Subirlo tiende a mejorar la precisión, a cambio de más tiempo de respuesta. Máximo 10 000. Valor inicial: 200.
about.vector.implNote=Nota de implementación: para recuperación, el modelo espera el prefijo <code>Query: </code> en las consultas. Las sinopsis se vectorizan con <code>input_type</code> <code>ingest</code> y sin prefijo.

about.hybrid.heading=Híbrida
about.hybrid.lead=Combina los dos modos anteriores con los mismos ajustes. El retriever <code>rrf</code> agrupa un retriever <code>standard</code>, con la consulta <code>match</code> o <code>multi_match</code> del componente full-text, y un retriever <code>knn</code> del componente vectorial.
about.hybrid.step1=<strong>1 · Componente full-text</strong> Lista ordenada por BM25 sobre <code>title</code> y/o <code>original_title</code>.
about.hybrid.step2=<strong>2 · Componente vectorial</strong> Lista ordenada por cercanía k-NN sobre el vector de sinopsis elegido.
about.hybrid.step3=<strong>3 · Fusión RRF</strong> Una sola lista final, ordenada por la posición de cada película en las dos listas.
about.hybrid.rrf.title=Cómo funciona Reciprocal Rank Fusion
about.hybrid.rrf.body=RRF combina las dos listas según la posición de cada película en ellas, no según su puntuación, porque las escalas de BM25 y de la similitud vectorial no son comparables. Una película que aparece arriba en ambas listas sube en el resultado final.
about.hybrid.params.title=Parámetros de la fusión
about.hybrid.params.lead=La demo no los expone en la interfaz: <code>rank_constant</code> usa el valor por defecto de Elasticsearch y <code>rank_window_size</code> lo fija la aplicación.
about.hybrid.params.rc.dd=Cuanto más alto, más influencia tienen las películas que están más abajo en cada lista.
about.hybrid.params.rw.dd=Cuántos resultados de cada componente entran a la fusión y cuántos resultados combinados se pueden recorrer. La aplicación lo iguala a <code>k</code> (100 por defecto), así que ambos componentes aportan la misma cantidad y las páginas de 25, 50 o 100 nunca salen vacías.

about.results.heading=Resultados y filtros
about.results.lead=Los resultados se muestran por páginas, con la puntuación que corresponde a cada modo, y se pueden acotar con filtros que se calculan a partir de los propios resultados.
about.results.page.title=Paginación
about.results.page.size.dt=25 · 50 · 100 por página
about.results.page.size.dd=El usuario elige el tamaño de página y se mueve con Anterior, Siguiente o el número de página. Al cambiar el tamaño o aplicar filtros se vuelve a la página 1.
about.results.page.ft.dt=Full-text
about.results.page.ft.dd=Se pueden recorrer todas las coincidencias con <code>from</code> y <code>size</code>, hasta el límite de 10 000 que fija <code>index.max_result_window</code>.
about.results.page.vec.dt=Vectorial
about.results.page.vec.dd=Hay como máximo <code>k</code> resultados (100 por defecto), repartidos en páginas.
about.results.page.hyb.dt=Híbrida
about.results.page.hyb.dd=Hay como máximo <code>rank_window_size</code> resultados combinados. La aplicación lo iguala a <code>k</code>, así que <code>from + size</code> nunca supera la ventana y ninguna página sale vacía.
about.results.score.title=Puntuación de cada resultado
about.results.score.ft.dd=Puntuación BM25. No tiene una escala fija: solo sirve para comparar resultados de una misma búsqueda.
about.results.score.vec.dd=Similitud k-NN. Con <code>cosine</code>, Elasticsearch devuelve (1 + coseno) / 2, un valor entre 0 y 1.
about.results.score.hyb.dd=La puntuación BM25 y la similitud k-NN, cada una con la posición de la película en su lista, más la puntuación RRF que define el orden final.
about.results.filters.title=Filtros
about.results.filters.fields.dt=Campos
about.results.filters.fields.dd=<code>adult</code>, <code>genres</code>, <code>release_date</code> (rango desde–hasta), <code>spoken_languages</code> y <code>rating</code>.
about.results.filters.combo.dt=Combinación
about.results.filters.combo.dd=Entre filtros distintos se cumplen todos; dentro de un mismo filtro basta con uno de los valores marcados. Los cambios se aplican al pulsar APLICAR; la fecha «Desde» no puede ser posterior a «Hasta».
about.results.filters.dyn.dt=Valores dinámicos
about.results.filters.dyn.dd=Cada filtro muestra solo los valores presentes en los resultados actuales, con cuántos resultados tienen cada uno, y se recalculan cada vez que cambian los resultados. Los valores ya marcados siguen visibles para poder desmarcarlos.
about.results.filters.es.dt=En Elasticsearch
about.results.filters.es.dd=Full-text: los filtros van en el contexto <code>filter</code> de la consulta, que no altera la puntuación BM25, y los valores salen de agregaciones <code>terms</code>. Vectorial: los filtros van en el <code>filter</code> del retriever <code>knn</code>, que se aplica durante la búsqueda, así que se devuelven <code>k</code> películas que los cumplen. Híbrida: van en el <code>filter</code> del retriever <code>rrf</code>, que se aplica a las dos búsquedas.
about.results.filters.vh.dt=Valores en Vectorial e Híbrida
about.results.filters.vh.dd=La aplicación los calcula sobre los resultados devueltos (hasta <code>k</code>). En RRF las agregaciones incluirían todas las coincidencias de cada búsqueda, incluso películas que no aparecen en la lista combinada.
about.results.empty.title=Cuando no hay resultados
about.results.empty.body=Si la búsqueda no encuentra nada, la página lo dice y sugiere ajustes según el modo (por ejemplo, OR en lugar de AND). Si la búsqueda sí encontró películas pero ninguna cumple los filtros, lo explica y ofrece quitarlos.
about.results.docs.pagination=Paginación
about.results.docs.knn=Filtrar kNN

about.load.heading=Carga de datos
about.load.lead=Se pueden agregar películas una por una o importar un archivo. El proceso valida todo antes de escribir y nunca deja el catálogo a medias.
about.load.ways.title=Formas de carga
about.load.ways.single.dt=Registro individual
about.load.ways.single.dd=Formulario con los campos del mapping. <code>id</code>, <code>title</code> y <code>plot</code> son obligatorios.
about.load.ways.json.dt=Archivo .json
about.load.ways.json.dd=La exportación del índice (objeto con <code>documents</code> y, opcionalmente, <code>mapping</code> y <code>document_count</code>), un arreglo de películas o NDJSON.
about.load.ways.csv.dt=Archivo .csv
about.load.ways.csv.dd=Texto UTF-8 con o sin BOM, separado por comas y con encabezado. Un CSV sin encabezado se rechaza. Las listas y los objetos anidados van como JSON dentro de la celda.
about.load.val.title=Validaciones
about.load.val.before.dt=Antes de subir
about.load.val.before.dd=Solo .json o .csv, sin dobles extensiones, de máximo {0} y con contenido de texto UTF-8. El servidor repite estas comprobaciones.
about.load.val.mapping.dt=Contra el mapping
about.load.val.mapping.dd=Se revisa el archivo completo: cada campo debe existir en el mapping y tener su tipo (<code>release_date</code> en yyyy-MM-dd, <code>adult</code> booleano, <code>keywords</code> y <code>belongs_to_collection</code> como objetos anidados). <code>id</code> no se puede repetir.
about.load.val.error.dt=Si algo no coincide
about.load.val.error.dd=La carga se detiene y no se importa ningún registro. La página muestra cada error con su registro, <code>id</code>, campo, valor recibido y lo que espera el mapping, y permite descargar el informe completo.
about.load.val.warn.dt=Advertencias
about.load.val.warn.dd=Lo que no rompe el mapping no detiene la carga: por ejemplo, los valores vacíos dentro de una lista se omiten y los textos vacíos se guardan sin valor.
about.load.imp.title=Importación
about.load.imp.vec.dt=Vectores
about.load.imp.vec.dd=Los tres vectores se generan siempre desde <code>plot</code> con el servicio de inferencia de Elasticsearch (jina-embeddings-v5-omni-small, <code>input_type</code> <code>ingest</code> y sin prefijo). Si el archivo trae <code>plot_256</code>, <code>plot_512</code> o <code>plot_1024</code>, se ignoran.
about.load.imp.temp.dt=Índice temporal
about.load.imp.temp.dd=Los registros se escriben en lotes de {0} en un índice temporal que empieza como copia del catálogo actual. Si un <code>id</code> ya existe, el registro reemplaza a la película.
about.load.imp.pub.dt=Publicación
about.load.imp.pub.dd=Al terminar se comprueba el conteo y el alias <code>{0}</code> pasa al índice nuevo en una sola operación atómica. El índice anterior se borra.
about.load.imp.fail.dt=Si falla
about.load.imp.fail.dd=Si Elasticsearch rechaza un lote o la comprobación no cuadra, se borra el índice temporal y el catálogo queda exactamente como estaba.
about.load.docs.aliases=Alias de índices

