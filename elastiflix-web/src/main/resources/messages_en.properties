home.lexical.multiHelp=multi-match searches both fields, <code>title</code> and <code>original_title</code>, with the <code>best_fields</code> type: each field is scored separately and the best match counts. With AND, all the words must appear in the same field.
home.lexical.bm25Help=<strong>Retrieval with BM25:</strong> each movie’s relevance is computed with BM25, the default scoring algorithm Elasticsearch uses for <code>text</code> fields. It favors query terms that appear in the field and are rare in the catalog, and adjusts the score for field length.
home.vector.hybridTitle=Vector component · k-NN
home.vector.field.aria=Vector field
home.vector.field.label=Vector k-NN
home.vector.dims.initial=256 dimensions.
home.vector.dims.suffix=dimensions.
home.vector.dims.help=It’s one of the three vector representations of the plot (<code>plot</code>). More dimensions usually capture more nuances of meaning, at the cost of more memory and more expensive comparisons.
home.vector.k.help=Maximum number of results the vector search returns, after merging the candidates from all shards; they’re split into pages of 25, 50 or 100. It must be less than or equal to <code>num_candidates</code>.
home.vector.k.hybridHelp=In hybrid mode it also sets how many results from each list go into the fusion and how many combined results you can page through.
home.vector.cand.help=Candidates evaluated on each shard before keeping the best <code>k</code>. Raising it tends to improve accuracy, at the cost of longer response times. Maximum 10,000.
home.vector.knnHelp=<strong>k-NN (k nearest neighbors):</strong> your query is turned into a vector, and the search looks for the movies whose plot has the closest vector. Elasticsearch does this approximately over an HNSW graph, without comparing against the whole catalog, which makes it fast but not always exact.
home.knn.error.k=k must be an integer greater than or equal to 1.
home.knn.error.candMax=num_candidates must be an integer no greater than 10,000.
home.knn.error.candMin=num_candidates must be greater than or equal to k.
home.hybrid.title=Fusion · RRF
home.hybrid.rrfHelp=<strong>Reciprocal Rank Fusion:</strong> Elasticsearch runs the BM25 search and the k-NN search separately and combines the two lists by each movie’s position in them, not by its score, because BM25 scores and vector similarity are on different scales. A movie that ranks high in both lists rises in the final result.
