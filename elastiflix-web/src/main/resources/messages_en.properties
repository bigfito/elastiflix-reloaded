# About the demo page (/acerca)
about.page.title=About the demo
about.intro.eyebrow=About the demo
about.intro.heading=Three ways to search for a movie
about.intro.lead=Elastiflix-Movies Java searches a movie catalog stored in an Elasticsearch Serverless index. With the same query you can try three search modes and see how the results change with each one: by words, by meaning, or by combining both. You can also narrow the results with filters and load new movies into the catalog.

about.modes.aria=Mode overview
about.modes.fulltext.title=Full-text (lexical)
about.modes.fulltext.desc=Finds movies whose title contains the words in your query.
about.modes.fulltext.meta=BM25 · title, original_title
about.modes.vector.title=Vector
about.modes.vector.desc=Finds movies whose plot is close in meaning to what you describe.
about.modes.vector.meta=k-NN · plot_256, plot_512, plot_1024
about.modes.hybrid.title=Hybrid
about.modes.hybrid.desc=Runs both searches above and merges their results into a single list.
about.modes.hybrid.meta=BM25 + k-NN · RRF fusion

about.common.settings=Available settings
about.common.docs=Documentation
about.common.field=Field
about.common.type=Type

about.fulltext.heading=Full-text (lexical)
about.fulltext.lead=Matches terms in the <code>title</code> and <code>original_title</code> fields, both of type <code>text</code>. Elasticsearch analyzes the query text into tokens and compares them with the indexed tokens of each title.
about.fulltext.bm25.title=How relevance is scored: BM25
about.fulltext.bm25.body=BM25 is Elasticsearch's default scoring algorithm for <code>text</code> fields. It favors query terms that appear in the field and are rare across the catalog. Two parameters control its behavior: <code>k1</code> (default 1.2) limits how much a repeated term adds, and <code>b</code> (default 0.75) adjusts the score for field length.
about.fulltext.match.dt=Query type: match
about.fulltext.match.dd=Searches a single field, which you choose: <code>title</code> or <code>original_title</code>.
about.fulltext.multimatch.dt=Query type: multi-match
about.fulltext.multimatch.dd=Searches both fields at once with the <code>best_fields</code> type: each field is scored separately and the movie gets the score of the best-matching field.
about.fulltext.or.dt=Operator: OR
about.fulltext.or.dd=Any one of the query words is enough. This is Elasticsearch's default behavior.
about.fulltext.and.dt=Operator: AND
about.fulltext.and.dd=All the words must appear. With multi-match and <code>best_fields</code>, they must all be in the same field: they can't be split between <code>title</code> and <code>original_title</code>.

about.vector.heading=Vector
about.vector.lead=Searches by meaning in each movie's plot (the <code>plot</code> field). Your query text is turned into a vector with the <strong>jina-embeddings-v5-omni-small</strong> model, and Elasticsearch returns the movies whose plot vectors are closest, using the <code>knn</code> retriever.
about.vector.knn.title=How k-NN works
about.vector.knn.body=k-NN (k-nearest neighbors) finds the vectors closest to the query vector. Elasticsearch does this approximately over an HNSW graph: it walks the graph instead of comparing against the whole catalog, which makes it fast but not always exact.
about.vector.reps.title=The three plot representations
about.vector.reps.body=This mode is meant to test how the number of vector dimensions affects result precision. All three fields come from the same model: its native dimension is 1024, and it supports Matryoshka truncation to 256 and 512.
about.vector.table.dimensions=Dimensions
about.vector.table.source=Source
about.vector.table.matryoshka=First values of the 1024-dimension vector, renormalized (Matryoshka)
about.vector.table.full=Full model vector
about.vector.fair=<strong>A fair comparison.</strong> All three fields use the same index settings: <code>index_options</code> of type <code>hnsw</code> with unquantized float vectors, the same <code>m</code> (16) and <code>ef_construction</code> (100), which are Elasticsearch's defaults, and <code>cosine</code> similarity. That way, the only difference between them is the number of dimensions.
about.vector.precision.title=Measured precision by dimension
about.vector.precision.lead=Measured on the original catalog of 4,322 movies. Measured with 32 plot descriptions (26 in Spanish and 6 in English), each with a single correct movie in the catalog and no words from its title. The ranks were obtained in Elasticsearch and confirmed with an exact brute-force search: they match in every case.
about.vector.precision.th.rank1=Correct at rank 1
about.vector.precision.th.top5=In the top 5
about.vector.precision.th.top10=In the top 10
about.vector.precision.r256=22 of 32 (69%)
about.vector.precision.r512=25 of 32 (78%)
about.vector.precision.r1024=26 of 32 (81%)
about.vector.precision.mrr=MRR rewards ranking the correct movie near the top: it is 1 if the movie always comes 1st and 0.5 if it always comes 2nd. In 24 of the 32 queries the rank is the same in all three fields; the differences are concentrated in the hardest descriptions:
about.vector.precision.movie=Movie
about.vector.rank.1=1st
about.vector.rank.2=2nd
about.vector.rank.3=3rd
about.vector.rank.4=4th
about.vector.rank.10=10th
about.vector.rank.21=21st
about.vector.precision.b1=256 dimensions clearly lose precision; 512 comes very close to 1024 at half the size.
about.vector.precision.b2=More dimensions aren't always better in every case: Forrest Gump ranks 21st, 8th and 18th.
about.vector.precision.b3=With 32 queries this is a clear trend, not a firm statistical conclusion.
about.vector.setting.field.dt=Vector k-NN
about.vector.setting.field.dd=The field to search: <code>plot_256</code>, <code>plot_512</code> or <code>plot_1024</code>. More dimensions usually capture more nuances of meaning, at the cost of more memory and more expensive comparisons.
about.vector.setting.k.dd=Maximum number of results the vector search returns, after merging the candidates from all shards; they are split into pages of 25, 50 or 100. Must be less than or equal to <code>num_candidates</code>. Initial value: 100.
about.vector.setting.cand.dd=Candidates evaluated on each shard before keeping the best <code>k</code>. Raising it tends to improve precision, at the cost of longer response times. Maximum 10,000. Initial value: 200.
about.vector.implNote=Implementation note: for retrieval, the model expects the <code>Query: </code> prefix on queries. Plots are vectorized with <code>input_type</code> <code>ingest</code> and no prefix.

about.hybrid.heading=Hybrid
about.hybrid.lead=Combines the two modes above with the same settings. The <code>rrf</code> retriever wraps a <code>standard</code> retriever, with the <code>match</code> or <code>multi_match</code> query from the full-text component, and a <code>knn</code> retriever from the vector component.
about.hybrid.step1=<strong>1 · Full-text component</strong> List sorted by BM25 over <code>title</code> and/or <code>original_title</code>.
about.hybrid.step2=<strong>2 · Vector component</strong> List sorted by k-NN proximity on the chosen plot vector.
about.hybrid.step3=<strong>3 · RRF fusion</strong> A single final list, sorted by each movie's position in both lists.
about.hybrid.rrf.title=How Reciprocal Rank Fusion works
about.hybrid.rrf.body=RRF combines the two lists by each movie's position in them, not by its score, because BM25 scores and vector similarity use scales that can't be compared. A movie that ranks high in both lists moves up in the final result.
about.hybrid.params.title=Fusion parameters
about.hybrid.params.lead=The demo doesn't expose them in the UI: <code>rank_constant</code> uses Elasticsearch's default and <code>rank_window_size</code> is set by the application.
about.hybrid.params.rc.dd=The higher it is, the more weight movies further down each list get.
about.hybrid.params.rw.dd=How many results from each component go into the fusion, and how many combined results you can page through. The application sets it equal to <code>k</code> (100 by default), so both components contribute the same number and pages of 25, 50 or 100 are never empty.

about.results.heading=Results and filters
about.results.lead=Results are shown in pages, with the score that matches each mode, and can be narrowed with filters computed from the results themselves.
about.results.page.title=Pagination
about.results.page.size.dt=25 · 50 · 100 per page
about.results.page.size.dd=You choose the page size and move with Previous, Next or a page number. Changing the size or applying filters takes you back to page 1.
about.results.page.ft.dt=Full-text
about.results.page.ft.dd=You can page through all matches with <code>from</code> and <code>size</code>, up to the 10,000 limit set by <code>index.max_result_window</code>.
about.results.page.vec.dt=Vector
about.results.page.vec.dd=There are at most <code>k</code> results (100 by default), split into pages.
about.results.page.hyb.dt=Hybrid
about.results.page.hyb.dd=There are at most <code>rank_window_size</code> combined results. The application sets it equal to <code>k</code>, so <code>from + size</code> never exceeds the window and no page is empty.
about.results.score.title=Score of each result
about.results.score.ft.dd=BM25 score. It has no fixed scale: it's only useful for comparing results within the same search.
about.results.score.vec.dd=k-NN similarity. With <code>cosine</code>, Elasticsearch returns (1 + cosine) / 2, a value between 0 and 1.
about.results.score.hyb.dd=The BM25 score and the k-NN similarity, each with the movie's position in its list, plus the RRF score that sets the final order.
about.results.filters.title=Filters
about.results.filters.fields.dt=Fields
about.results.filters.fields.dd=<code>adult</code>, <code>genres</code>, <code>release_date</code> (from–to range), <code>spoken_languages</code> and <code>rating</code>.
about.results.filters.combo.dt=Combination
about.results.filters.combo.dd=Across different filters, all must match; within a single filter, any one of the checked values is enough. Changes take effect when you press APPLY; the “From” date can't be later than “To”.
about.results.filters.dyn.dt=Dynamic values
about.results.filters.dyn.dd=Each filter shows only the values present in the current results, with how many results have each one, and they're recalculated whenever the results change. Values you've already checked stay visible so you can uncheck them.
about.results.filters.es.dt=In Elasticsearch
about.results.filters.es.dd=Full-text: filters go in the query's <code>filter</code> context, which doesn't affect the BM25 score, and the values come from <code>terms</code> aggregations. Vector: filters go in the <code>filter</code> of the <code>knn</code> retriever, which applies them during the search, so it returns <code>k</code> movies that match them. Hybrid: they go in the <code>filter</code> of the <code>rrf</code> retriever, which applies to both searches.
about.results.filters.vh.dt=Values in Vector and Hybrid
about.results.filters.vh.dd=The application computes them from the returned results (up to <code>k</code>). With RRF, aggregations would include every match from each search, even movies that don't appear in the combined list.
about.results.empty.title=When there are no results
about.results.empty.body=If the search finds nothing, the page says so and suggests settings for the mode (for example, OR instead of AND). If the search did find movies but none match the filters, it explains this and offers to remove them.
about.results.docs.pagination=Pagination
about.results.docs.knn=Filtered kNN search

about.load.heading=Loading data
about.load.lead=You can add movies one at a time or import a file. The process validates everything before writing and never leaves the catalog half-finished.
about.load.ways.title=Ways to load data
about.load.ways.single.dt=Single record
about.load.ways.single.dd=A form with the mapping fields. <code>id</code>, <code>title</code> and <code>plot</code> are required.
about.load.ways.json.dt=.json file
about.load.ways.json.dd=The index export (an object with <code>documents</code> and, optionally, <code>mapping</code> and <code>document_count</code>), an array of movies, or NDJSON.
about.load.ways.csv.dt=.csv file
about.load.ways.csv.dd=UTF-8 text with or without BOM, comma-separated, with a header. A CSV without a header is rejected. Lists and nested objects go as JSON inside the cell.
about.load.val.title=Validation
about.load.val.before.dt=Before uploading
about.load.val.before.dd=Only .json or .csv, no double extensions, up to {0}, with UTF-8 text content. The server repeats these checks.
about.load.val.mapping.dt=Against the mapping
about.load.val.mapping.dd=The whole file is checked: every field must exist in the mapping and have its type (<code>release_date</code> as yyyy-MM-dd, <code>adult</code> as a boolean, <code>keywords</code> and <code>belongs_to_collection</code> as nested objects). <code>id</code> can't be repeated.
about.load.val.error.dt=If something doesn't match
about.load.val.error.dd=The load stops and no records are imported. The page shows each error with its record, <code>id</code>, field, received value and what the mapping expects, and lets you download the full error report.
about.load.val.warn.dt=Warnings
about.load.val.warn.dd=Anything that doesn't break the mapping doesn't stop the load: for example, empty values inside a list are skipped and empty strings are stored without a value.
about.load.imp.title=Import
about.load.imp.vec.dt=Vectors
about.load.imp.vec.dd=The three vectors are always generated from <code>plot</code> with the Elasticsearch inference service (jina-embeddings-v5-omni-small, <code>input_type</code> <code>ingest</code> and no prefix). If the file includes <code>plot_256</code>, <code>plot_512</code> or <code>plot_1024</code>, they're ignored.
about.load.imp.temp.dt=Temporary index
about.load.imp.temp.dd=Records are written in batches of {0} to a temporary index that starts as a copy of the current catalog. If an <code>id</code> already exists, the record replaces the movie.
about.load.imp.pub.dt=Publication
about.load.imp.pub.dd=When it finishes, the count is checked and the <code>{0}</code> alias moves to the new index in a single atomic operation. The previous index is deleted.
about.load.imp.fail.dt=If it fails
