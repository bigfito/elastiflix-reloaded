# Pipeline de Cloud Build: cada push a main construye la imagen, la publica en Artifact Registry
# (us-east1 y us-west1) y la despliega en los dos servicios de Cloud Run. El balanceador global
# envía a cada visitante a la región más cercana.
substitutions:
  _EAST: us-east1-docker.pkg.dev/${PROJECT_ID}/prod-elastiflix-us-east1/elastiflix
  _WEST: us-west1-docker.pkg.dev/${PROJECT_ID}/prod-elastiflix-us-west1/elastiflix
  _RUNTIME_SA: bigfito-web-runtime@${PROJECT_ID}.iam.gserviceaccount.com

steps:
  # El Dockerfile compila y corre ./mvnw verify; si falla, no se publica nada.
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_EAST}:${SHORT_SHA}', '-t', '${_WEST}:${SHORT_SHA}', '.']

  - id: push-east1
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_EAST}:${SHORT_SHA}']
    waitFor: ['build']

  - id: push-west1
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_WEST}:${SHORT_SHA}']
    waitFor: ['build']

  # Cada servicio usa la imagen de su región. La configuración va completa en cada despliegue,
  # así el pipeline también puede crear el servicio si no existe.
  - id: deploy-east1
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - prod-elastiflix-east1
      - --image=${_EAST}:${SHORT_SHA}
      - --region=us-east1
      - --service-account=${_RUNTIME_SA}
      - --ingress=internal-and-cloud-load-balancing
      - --set-secrets=ELASTICSEARCH_URL=elastiflix-elasticsearch-url:latest,ELASTICSEARCH_API_KEY=elastiflix-elasticsearch-api-key:latest
      - --port=8080
      - --cpu=1
      - --memory=1Gi
      - --min-instances=0
      - --max-instances=3
      - --concurrency=80
      - --no-cpu-throttling
      - --cpu-boost
      - --session-affinity
      - --quiet
    waitFor: ['push-east1']

  - id: deploy-west1
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - prod-elastiflix-west1
      - --image=${_WEST}:${SHORT_SHA}
      - --region=us-west1
      - --service-account=${_RUNTIME_SA}
      - --ingress=internal-and-cloud-load-balancing
      - --set-secrets=ELASTICSEARCH_URL=elastiflix-elasticsearch-url:latest,ELASTICSEARCH_API_KEY=elastiflix-elasticsearch-api-key:latest
      - --port=8080
      - --cpu=1
      - --memory=1Gi
      - --min-instances=0
      - --max-instances=3
      - --concurrency=80
      - --no-cpu-throttling
      - --cpu-boost
      - --session-affinity
      - --quiet
    waitFor: ['push-west1']

  # Cloud Run no tiene una política para conservar solo las últimas revisiones: después de desplegar,
  # borra las que no reciben tráfico. Es de mejor esfuerzo: si no puede leer el tráfico de un servicio no
  # borra nada en él, y un borrado que falla deja un aviso sin marcar el build como fallido.
  - id: cleanup-revisions
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        for pair in prod-elastiflix-east1:us-east1 prod-elastiflix-west1:us-west1; do
          service=$${pair%%:*}
          region=$${pair##*:}
          serving=$$(gcloud run services describe "$$service" --region="$$region" \
            --format='value(status.traffic[].revisionName)' | tr ';,' '  ')
          if [ -z "$${serving// /}" ]; then
            echo "Aviso: no se leyó el tráfico de $$service; no se borra ninguna revisión"
            continue
          fi
          for revision in $$(gcloud run revisions list --service="$$service" --region="$$region" \
            --format='value(metadata.name)'); do
            case " $$serving " in *" $$revision "*) continue ;; esac
            gcloud run revisions delete "$$revision" --region="$$region" --quiet \
              || echo "Aviso: no se pudo borrar $$revision"
          done
        done
    waitFor: ['deploy-east1', 'deploy-west1']

  # La política de limpieza de Artifact Registry solo corre una vez al día. Después de borrar las revisiones,
  # este paso deja en cada repositorio solo la imagen de este commit y la de las revisiones con tráfico.
  # También es de mejor esfuerzo: sin esas imágenes identificadas no borra nada.
  - id: cleanup-images
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        for entry in "${_EAST}|prod-elastiflix-east1|us-east1" "${_WEST}|prod-elastiflix-west1|us-west1"; do
          IFS='|' read -r image service region <<< "$$entry"
          keep=$$(gcloud artifacts docker images describe "$$image:${SHORT_SHA}" \
            --format='value(image_summary.digest)')
          for revision in $$(gcloud run services describe "$$service" --region="$$region" \
            --format='value(status.traffic[].revisionName)' | tr ';,' '  '); do
            used=$$(gcloud run revisions describe "$$revision" --region="$$region" \
              --format='value(spec.containers[0].image)')
            keep="$$keep $${used##*@}"
          done
          case "$$keep" in *sha256:*) ;; *)
            echo "Aviso: no se identificó la imagen en uso en $$image; no se borra ninguna"
            continue ;;
          esac
          for digest in $$(gcloud artifacts docker images list "$$image" --format='value(version)'); do
            case " $$keep " in *" $$digest "*) continue ;; esac
            gcloud artifacts docker images delete "$$image@$$digest" --delete-tags --quiet \
              || echo "Aviso: no se pudo borrar $$image@$$digest"
          done
        done
    waitFor: ['cleanup-revisions']

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

timeout: 1800s
